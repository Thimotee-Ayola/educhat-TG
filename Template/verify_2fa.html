{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Code de vérification</h1>
  <p class="subtitle">Entre le code affiché dans ton appli d'authentification.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}

  <form method="POST">
    <input type="text" name="code" placeholder="Code à 6 chiffres" required maxlength="6" autofocus>
    <button type="submit">Valider</button>
  </form>
</div>
{% endblock %}
