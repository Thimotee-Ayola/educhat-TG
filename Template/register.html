{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="brand"><span class="dot g"></span><span class="dot y"></span><span class="dot r"></span></div>
  <h1>Créer un compte</h1>
  <p class="subtitle">EduChat Togo — messagerie sécurisée pour enseignants</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}

  <form method="POST">
    <input type="text" name="username" placeholder="Nom d'utilisateur" required>
    <input type="password" name="password" placeholder="Mot de passe (8 caractères min.)" required>
    <button type="submit">S'inscrire</button>
  </form>
  <a class="link" href="{{ url_for('login') }}">J'ai déjà un compte</a>
</div>
{% endblock %}
